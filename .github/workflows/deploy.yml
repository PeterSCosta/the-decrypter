name: Build and Push

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate tag
        id: tag
        run: echo "TAG=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_W3W_API_KEY=${{ secrets.VITE_W3W_API_KEY }}
          tags: |
            petercosta/the-decrypter:latest
            petercosta/the-decrypter:${{ steps.tag.outputs.TAG }}
          cache-from: type=registry,ref=petercosta/the-decrypter:buildcache
          cache-to: type=registry,ref=petercosta/the-decrypter:buildcache,mode=max
