services:
  the-decrypter:
    image: petercosta/the-decrypter:latest
    pull_policy: always
    hostname: the-decrypter
    environment:
      - TZ=America/Sao_Paulo
      # Basic Auth do nginx — SUPERADO pelo login do app (e-mail + senha com
      # aprovação manual do admin), e JÁ REMOVIDO do Dokploy em agosto/2026.
      # As duas variáveis continuam declaradas só para o compose não quebrar em
      # ambiente que ainda as tenha; vazias, o nginx não pede senha nenhuma.
      #
      # Vale lembrar por que ele não bastava: o Basic Auth é uma senha só,
      # compartilhada, e protege apenas este domínio — a API em
      # apidecrypter.thelogiclab.com.br ficava aberta a quem soubesse a URL. Agora
      # os endpoints de dados exigem token.
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-}
      - BASIC_AUTH_PASSWORD=${BASIC_AUTH_PASSWORD:-}
    restart: always
    networks:
      - logiclabnetwork

# Domínio (decrypter.thelogiclab.com.br) e porta (80) são configurados no Dokploy.
networks:
  logiclabnetwork:
    name: logiclabnetwork
    external: true
