server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Senha de acesso opcional (gerada pelo entrypoint a partir das env vars).
  include /etc/nginx/auth.conf;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  # O nível padrão é 1 e deixa ~320 KB na mesa só nas wordlists (1,79 MB → 1,47 MB
  # em pt+en). No 4G de uma gincana isso é a diferença entre a bancada abrir e não.
  gzip_comp_level 5;
  # Padrão é `off`: qualquer proxy à frente que mande o header `Via` desligaria o
  # gzip inteiro e o usuário baixaria os 9,8 MB crus de /data.
  gzip_proxied any;
  # `text/javascript` é redundante hoje (o mime.types do nginx 1.27 mapeia .js para
  # application/javascript), mas custa nada e cobre a troca quando ela vier.
  gzip_types text/plain text/css text/javascript application/javascript application/json
             image/svg+xml;

  # Assets com hash no nome → cache longo e imutável.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Datasets (CEP, ruas, municípios) → cache moderado.
  # Datasets (vocabulário, CEP, ruas, municípios) → imutáveis.
  #
  # O Vite não renomeia o que está em `public/`, então antes daqui a única opção
  # honesta era `expires 1d`: todo mundo rebaixava o vocabulário e as bases uma
  # vez por dia, para sempre, sem nada ter mudado. Agora `src/lib/data.ts` pede
  # cada arquivo com o hash do conteúdo na query (`?v=ab12cd34`, gerado em
  # `vite.config.ts`), então a URL muda sozinha quando o dado muda — e só então.
  #
  # NÃO acrescente `try_files ... /index.html` aqui: um cliente velho pedindo um
  # dataset que saiu receberia o HTML da SPA com status 200, e ele chegaria ao
  # `JSON.parse` como "Unexpected token '<'" (o comentário de `loadOnce` conta
  # essa história). O 404 seco é o comportamento certo.
  location /data/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # O shell da SPA NÃO pode ficar em cache. Sem Cache-Control explícito o
  # navegador aplica cache heurístico (~10% da idade do arquivo) e serve um
  # index.html velho, que aponta para /assets/index-<hash>.js que o deploy novo
  # já não tem — 404 no script, tela branca até alguém dar hard refresh.
  # Vale também para o fallback do try_files (redirect interno reentra aqui).
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # SPA: qualquer rota cai no index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
